# Local environment. Day-to-day development: `docker compose up -d postgres redis mailpit`
# and run the apps with `npm run start:dev` / `npm run dev` (hot reload).
# Full stack in containers, as on Coolify: `docker compose up --build`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-maia}
      POSTGRES_USER: ${POSTGRES_USER:-maia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maia}
    # 5433 on the host so it can run alongside Yuma's postgres (5432).
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maia} -d ${POSTGRES_DB:-maia}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Cache of the API responses (keys MAIA_APP_*). Nothing to keep: no volume.
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

  # Catches every email sent in development: web UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  maia-be:
    build: ./maia-be
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-maia}:${POSTGRES_PASSWORD:-maia}@postgres:5432/${POSTGRES_DB:-maia}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      APP_URL: ${APP_URL:-http://localhost:3001}
      MAILPIT_HOST: mailpit
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-MAIA <noreply@maia.local>}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started

  maia-fe:
    build: ./maia-fe
    ports:
      - "3001:3001"
    environment:
      # Server-side only: maia-fe proxies /api/* to maia-be (see app/api).
      API_URL: http://maia-be:3000
    depends_on:
      - maia-be

volumes:
  postgres_data:
